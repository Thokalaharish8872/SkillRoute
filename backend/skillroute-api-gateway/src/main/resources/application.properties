spring.application.name=${APPLICATION_NAME}

server.port=${SERVER_PORT}

eureka.client.register-with-eureka=${REGISTER_WITH_EUREKA}
eureka.client.fetch-registry=${FETCH_REGISTRY}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

jwt.super.secret.key=${JWT_SUPER_SECRET_KEY}
public.ip=${PUBLIC_IP};

server.netty.connection-timeout=10s
server.netty.idle-timeout=60s

spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=30s

spring.cloud.gateway.httpclient.pool.type=elastic

server.tomcat.threads.max=500
server.tomcat.threads.min-spare=50
server.tomcat.max-connections=10000
server.tomcat.accept-count=5000
